spring.application.name=employee_management
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
services.employee.base-url=http://localhost:8080
services.department.base-url=http://localhost:8080
services.employee.get-by-id-path=/employees/{id}
services.department.get-by-id-path=/departments/{id}